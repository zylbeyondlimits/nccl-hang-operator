apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nccl-hang-node-agent
  namespace: gpu-infra-system
spec:
  selector:
    matchLabels:
      app: nccl-hang-node-agent
  template:
    metadata:
      labels:
        app: nccl-hang-node-agent
    spec:
      hostPID: true
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: agent
          image: ghcr.io/zylbeyondlimits/nccl-hang-node-agent:v0.1.0
          args:
            - --btf-path=/sys/kernel/btf/vmlinux
            - --ib-root=/sys/class/infiniband
            - --poll-interval=10s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # Strict least-privilege CO-RE eBPF capabilities (no --privileged)
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CAP_BPF", "CAP_PERFMON"]
          volumeMounts:
            - name: btf
              mountPath: /sys/kernel/btf/vmlinux
              readOnly: true
            - name: infiniband
              mountPath: /sys/class/infiniband
              readOnly: true
            - name: flight-recorder-shm
              mountPath: /dev/shm/nccl-flight-recorder
              readOnly: true
      volumes:
        - name: btf
          hostPath:
            path: /sys/kernel/btf/vmlinux
        - name: infiniband
          hostPath:
            path: /sys/class/infiniband
        - name: flight-recorder-shm
          hostPath:
            path: /var/run/nccl-flight-recorder
